<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petal Arena</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2b22; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
  canvas { display: block; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(15, 30, 20, 0.55); gap: 14px; }
  .overlay h1 { margin: 0; font-size: 56px; color: #fff; letter-spacing: 2px; text-shadow: 0 4px 0 #2a5c3e; }
  .overlay p { margin: 0; color: #dfeee4; font-size: 14px; }
  input { font-size: 20px; padding: 10px 14px; border-radius: 10px; border: 3px solid #2a5c3e; outline: none; width: 240px; text-align: center; }
  button { font-size: 20px; padding: 10px 28px; border-radius: 10px; border: 3px solid #2a5c3e; background: #6fd18f; color: #12301f; font-weight: 700; cursor: pointer; }
  button:hover { background: #8ee0a8; }
  .hidden { display: none; }
  .help { color: #cfe3d6; font-size: 13px; line-height: 1.6; text-align: center; }
  .tabs { display: flex; gap: 10px; }
  .tabs button { font-size: 15px; padding: 6px 18px; background: #e9f5ec; }
  .tabs button.on { background: #6fd18f; }
  #gallery { width: min(760px, calc(100vw - 32px)); max-height: 46vh; overflow-y: auto; background: rgba(0,0,0,0.35);
    border-radius: 12px; padding: 12px; box-sizing: border-box; display: grid; gap: 10px;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .card { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 10px; color: #fff; font-size: 12px; display: flex; gap: 10px; }
  .card canvas { flex: none; border-radius: 6px; }
  .card b { font-size: 15px; display: block; margin-bottom: 3px; }
  .card .drop { display: inline-flex; align-items: center; gap: 4px; margin: 3px 6px 0 0; }
  .card .drop canvas { border-radius: 3px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="title" class="overlay">
  <h1>Petal Arena</h1>
  <input id="name" maxlength="16" placeholder="Your name" autofocus>
  <button id="play">Play</button>
  <div class="help">Move: mouse (or WASD / arrows) · Attack: left click / Space · Defend: right click / Shift</div>
  <div class="tabs"><button id="tabMobs">Mobs</button><button id="tabPetals">Petals</button></div>
  <div id="gallery" class="hidden"></div>
</div>

<script src="client.js"></script>
</body>
</html>
